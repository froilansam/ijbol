<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="IJBOL: It Just Builds, Obviously Lean">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; white-space: pre; }
    </style>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1180" cy="-40" r="220" fill="#3b82f6" opacity="0.12"/>
  <circle cx="80" cy="460" r="180" fill="#60a5fa" opacity="0.08"/>

  <text x="80" y="190" font-size="128" font-weight="800" fill="#f8fafc" letter-spacing="-3">IJBOL</text>
  <text x="84" y="245" font-size="34" font-weight="600" fill="#bfdbfe">It Just Builds, Obviously Lean.</text>
  <text x="84" y="290" font-size="21" fill="#94a3b8">A Claude Code skill pack for lean, clean, good-looking code.</text>
  <text x="84" y="340" font-size="18" fill="#8b9bb4">The diff is so small you burst out laughing.</text>

  <g transform="translate(700 70)">
    <rect width="500" height="280" rx="14" fill="#0b1220" stroke="#334155"/>
    <circle cx="24" cy="24" r="6" fill="#f87171"/>
    <circle cx="44" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="24" r="6" fill="#4ade80"/>
    <text x="92" y="30" class="mono" fill="#94a3b8">1 file changed</text>
    <text x="250" y="30" class="mono" fill="#4ade80" font-weight="700">+2</text>
    <text x="290" y="30" class="mono" fill="#f87171" font-weight="700">−142</text>
    <line x1="0" y1="48" x2="500" y2="48" stroke="#1e293b"/>

    <rect x="0" y="62" width="500" height="30" fill="#f87171" opacity="0.12"/>
    <text x="20" y="83" class="mono" fill="#fca5a5">- class AbstractTotalStrategyFactory {</text>
    <rect x="0" y="94" width="500" height="30" fill="#f87171" opacity="0.12"/>
    <text x="20" y="115" class="mono" fill="#fca5a5">-   // TODO: make configurable later</text>
    <rect x="0" y="126" width="500" height="30" fill="#f87171" opacity="0.12"/>
    <text x="20" y="147" class="mono" fill="#fca5a5">-   options, flags, modes, wrappers…</text>
    <text x="20" y="179" class="mono" fill="#475569">  @@ 139 more lines nobody asked for @@</text>
    <rect x="0" y="194" width="500" height="30" fill="#4ade80" opacity="0.12"/>
    <text x="20" y="215" class="mono" fill="#86efac">+ const total = sum(items.map(getPrice))</text>
    <rect x="0" y="226" width="500" height="30" fill="#4ade80" opacity="0.12"/>
    <text x="20" y="247" class="mono" fill="#86efac">+ export { total }</text>
  </g>
</svg>
